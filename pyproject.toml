[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cairn"
version = "0.6.0a1"
description = "Configurable learning workflows with a visual authoring canvas and learner-facing application"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "fsrs==6.3.2",
    "fastapi>=0.110",
    "jinja2>=3.1",
    "uvicorn>=0.29",
    "mcp>=2.3.0",
    "math-verify>=0.8",
    "rapidocr-onnxruntime>=1.4,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]
# 真摄像头只在 macOS 上走 AVFoundation；没装也能跑（工厂回退假设备）。
# 装法：pip install -e ".[macos]"
macos = [
    "pyobjc-framework-AVFoundation>=10",
]
# 语音输入（M2）：麦克风采集。不装则 `--mic` 给中文提示、文本模式照常。
# 语音进出（M3b）：opuslib 是 libopus 的薄 ctypes 封装，系统要先有 libopus
# （macOS `brew install opus`，Debian `apt install libopus0`）。
# 装法：pip install -e ".[voice]"
voice = [
    "sounddevice>=0.5",
    "opuslib>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cairn = ["templates/*.html", "static/*", "recipes/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
