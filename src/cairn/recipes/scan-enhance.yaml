# 扫一页卷子（可选增强）：摆正 → 裁到纸 → 增强 → 切成题 → 认字。
#
# 与 scan-entry.yaml 的区别只有一步：中间多了「增强」。摆正解决"拍歪/阴影"，
# 裁切解决"纸只占画面一半、周围全是桌面"，增强解决"纸不白、字不黑"——三件事分开，
# 关掉增强也还能用（那就是 scan-entry）。
#
# 「裁切」在上传时已经干完（`scan_service.save_upload`，裁完的图就是 `scan.path`
# 指向的那张），这一步照实念上传时的判定。
#
# 顺序就是页面上那行痕迹的顺序。on_error 只能是 keep / skip / ask：
#   keep 保持原样继续 / skip 这步先不做 / ask 把原因交给界面提示家长
# 增强是"锦上添花"：失败就保持原样继续（keep），不许把后面的切题/认字拖死。
# 改完这份文件要清缓存（测试里 clear_cache()；线上重启即可）。
name: scan-enhance
title: 扫一页卷子（摆正、增强、切成题）
steps:
  - {name: 摆正, tool: preprocess, on_error: keep}
  - {name: 裁切, tool: crop,       on_error: keep}
  - {name: 增强, tool: enhance,    on_error: keep}
  - {name: 切题, tool: cut,        on_error: ask}
  - {name: 认字, tool: ocr,        on_error: ask}
